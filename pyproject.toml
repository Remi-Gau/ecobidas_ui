[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
    { include-group = "test" },
    "pre-commit",
    "tox",
    "tox-uv",
    { include-group = "typecheck" },
    { include-group = "visual" }
]
test = [
    "coverage",
    "pytest>=6.0.0",
    "pytest-cov",
    "pytest-django"
]
typecheck = [
    "pyrefly",
    "django-stubs",
    "pandas-stubs",
    "types-requests"
]
visual = [
    { include-group = "test" },
    "pillow",
    "pixelmatch",
    # keep in sync with the playwright docker image used to run the visual tests
    "playwright==1.63.0",
    "pytest-playwright"
]

[project]
authors = [{ name = "Remi Gau" }]
dependencies = [
    "django>=5.2",
    "django-bootstrap5",
    "whitenoise",
    "pandas",
    "rich",
    "requests",
    "environs",
    "markdownify",
    "gunicorn"
]
description = "UI for eCOBIDAS"
# Version from setuptools_scm
dynamic = ["version"]
license = { text = "GPL 3.0" }
maintainers = [{ name = "Remi Gau", email = "remi.gau2@mcgill.ca" }]
name = "ecobidas_ui"
readme = "README.md"
requires-python = ">=3.12"

[tool.codespell]
ignore-words-list = "te,nd,jist,notin"
skip = "./.git,*.svg,env,ecobidas_ui/locale/**"

[tool.djlint]
format_css = true
format_js = true
indent = 2
max_line_length = 100
# the width of the progress bar is computed for each request
per-file-ignores = { "ecobidas_ui/protocols/templates/protocols/protocol.html" = "H021" }
profile = "django"

[tool.hatch.build.hooks.vcs]
version-file = "ecobidas_ui/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ecobidas_ui"]

[tool.hatch.version]
source = "vcs"

[tool.pyrefly]
# generated by hatch-vcs at install time
ignore-missing-imports = [
    "ecobidas_ui._version",
    # only installed for the visual regression tests:
    # too big for the pyrefly pre-commit hook environment
    "PIL.*",
    "pixelmatch.*",
    "playwright.*"
]
project-excludes = ["ecobidas_ui/_version.py"]
project-includes = ["ecobidas_ui", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ecobidas_ui.settings"
addopts = "-ra --strict-config --strict-markers --doctest-modules --showlocals -s -v --ignore=ecobidas_central --ignore=translate -m 'not visual'"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
junit_family = "xunit2"
markers = ["visual: visual regression tests (run with: pytest -m visual)"]
minversion = "6.0"
xfail_strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "E712"]
# B: bugbear, C90: complexity, D: docstrings, E/W: pycodestyle, F: pyflakes,
# I: isort, PLR091: too many arguments / returns, UP: pyupgrade
select = ["B", "C90", "D", "E", "F", "I", "PLR0911", "PLR0913", "UP", "W"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 10
max-returns = 7
