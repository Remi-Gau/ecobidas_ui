{% load i18n %}
<div class="navbar-expand-sm mb-5">
  <ul class="nav flex-column nav-pills nav-fill">
    {% for act in activities %}
      <li class="nav-item">
        <a class="{{ act.class }}"
           aria-current="page"
           href="{{ act.link }}">{% if forloop.counter0 > 0 %}{{ forloop.counter0 }} - {% endif %}{{ act.name }}</a>
      </li>
    {% endfor %}
    <!--  -->
    {% if show_export_button %}
      <li class="nav-item">
        <a href="{% url 'export' %}"
           type="button"
           class="btn btn-outline-primary my-1">{% translate "Export" %}</a>
      </li>
      <li class="nav-item">
        <a href="{% url 'generate:generate' %}"
           type="button"
           class="btn btn-outline-primary my-1">{% translate "Generate method" %}</a>
      </li>
    {% endif %}
  </ul>
</div>
