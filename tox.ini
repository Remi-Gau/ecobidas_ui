;  See https://tox.wiki/en
[tox]
requires =
    tox>=4
    tox-uv
; run lint by default when just calling "tox"
env_list = lint

[global_var]
passenv =
    PY_COLORS
    FORCE_COLOR
    NO_COLOR
    CLICOLOR
    CLICOLOR_FORCE

[testenv:lint]
description = install pre-commit hooks and run all linters and formatters
skip_install = true
deps =
    pre-commit
commands =
    pre-commit install
    pre-commit run --all-files --show-diff-on-failure {posargs:}

[testenv:update_dependencies]
description = update uv.lock
skip_install = true
allowlist_externals = uv
commands =
    uv lock --upgrade {posargs:}

[testenv:test]
description = run tests
runner = uv-venv-lock-runner
; tox-uv only passes the minor version to uv,
; which then uses the latest managed 3.12 (see .python-version)
base_python = python3.12
uv_python_preference = managed
passenv = {[global_var]passenv}
dependency_groups = test
commands =
    pytest --cov=ecobidas_ui --cov-report=xml --cov-report=html {posargs:}
