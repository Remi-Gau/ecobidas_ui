---
services:
    backend:
        build: .
        restart: always
        command: gunicorn -w 2 -b :8000 ecobidas_ui.wsgi
        environment:
            # set in your shell or in a .env file next to this file
            SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your shell or in .env}
            DEBUG: 'false'
            ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
        expose:
        -   8000
        networks:
        -   frontnet

    proxy:
        build: proxy
        restart: always
        ports:
        -   80:80
        depends_on:
        -   backend
        networks:
        -   frontnet

networks:
    frontnet:
