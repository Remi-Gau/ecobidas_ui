---
services:
    backend:
        build: .
        restart: always
        # update the database before starting the site
        command: sh -c "python manage.py migrate --noinput && gunicorn -w 2 -b :8000 ecobidas_ui.wsgi"
        environment:
            # set in your shell or in a .env file next to this file
            SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your shell or in .env}
            DEBUG: 'false'
            ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
            DATABASE_PATH: /data/db.sqlite3
            # log in with ORCID: see the README
            ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
            ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
            ORCID_URL: ${ORCID_URL:-https://orcid.org}
        volumes:
        -   db:/data
        expose:
        -   8000
        healthcheck:
            # use the first allowed host: django rejects requests for other hosts
            test: [CMD-SHELL, 'curl --fail --silent --output /dev/null --header "Host: $${ALLOWED_HOSTS%%,*}" http://localhost:8000/en/index']
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
        -   frontnet

    proxy:
        build: proxy
        restart: always
        ports:
        -   80:80
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            # static files are served by the backend without checking the host
            test: [CMD-SHELL, curl --fail --silent --output /dev/null http://localhost/static/css/main.css]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
        -   frontnet

networks:
    frontnet:

volumes:
    db:
